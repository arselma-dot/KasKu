<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KasKu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>KasKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.9);
  --ink:#0f172a; --ink-2:#475569; --muted:#8a94a6; --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.05);
  --brand-1:#3b82f6; --brand-2:#6366f1; --brand-3:#8b5cf6; --teal:#14b8a6;
  --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 48%,#8b5cf6 100%);
  --grad-soft:linear-gradient(135deg,rgba(59,130,246,.10),rgba(139,92,246,.10));
  --s-masuk:#0e9f8e; --s-keluar:#7357e8; --s-pagi:#c27511; --s-malam:#4a50d6; --s-tertulis:#4a50d6; --s-real:#0e9f8e;
  --good:#15803d; --good-bg:#ecfdf3; --warn:#b45309; --warn-bg:#fff7ed; --bad:#dc2626; --bad-bg:#fef2f2;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 10px 40px rgba(76,70,229,.18);
  --nav-h:70px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
svg[aria-hidden]:not(.chart){width:18px;height:18px;flex:none}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 50% at 15% 20%,rgba(99,102,241,.13),transparent 70%),radial-gradient(35% 45% at 90% 10%,rgba(20,184,166,.12),transparent 70%),radial-gradient(40% 40% at 60% 60%,rgba(139,92,246,.08),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:8px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) 18px 10px;display:flex;align-items:center;gap:12px;background:rgba(246,247,251,.78);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.logo svg{width:20px;height:20px;color:#fff}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.tb-title > span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--ink-2);position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .9s linear infinite}
.badge-dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.pill-demo{display:inline-block;vertical-align:2px;margin-left:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--grad-soft);color:var(--brand-2);border:1px solid rgba(99,102,241,.2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout ---------- */
main{padding:6px 16px calc(var(--nav-h) + var(--safe-b) + 34px);max-width:640px;margin:0 auto}
.view{animation:viewIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-h h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h a,.link{font-size:13px;font-weight:600;color:var(--brand-2);text-decoration:none;padding:6px 2px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line-2);padding:16px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--glass-line)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 12px rgba(15,23,42,.18)}

/* ---------- Hero ---------- */
.hero{position:relative;border-radius:26px;padding:20px 20px 18px;margin-top:8px;overflow:hidden;background:#fff;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(closest-side,rgba(139,92,246,.20),transparent);pointer-events:none}
.hero .lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.hero .lbl svg{width:16px;height:16px;color:var(--brand-2)}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:4px 0 12px;line-height:1.1}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.hero-row .k{font-size:12px;color:var(--muted)} .hero-row .v{font-weight:700;font-size:15px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px}
.tag svg{width:14px;height:14px}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.neutral{background:#f1f5f9;color:var(--ink-2)}

/* ---------- Today tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:var(--r-md);padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .t-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.tile .ic svg{width:16px;height:16px}
.tile .t-v{font-weight:800;font-size:16.5px;letter-spacing:-.02em}
.tile.empty .t-v svg{width:15px;height:15px}
.tile.empty .t-v{font-weight:600;font-size:13px;color:var(--brand-2);display:flex;align-items:center;gap:4px}
.tile.empty{border:1.5px dashed rgba(99,102,241,.28);box-shadow:none;background:rgba(255,255,255,.6)}
.ic.pagi{background:#fff4e5;color:var(--s-pagi)} .ic.malam{background:#eef0ff;color:var(--s-malam)} .ic.keluar{background:#f2efff;color:var(--s-keluar)} .ic.real{background:#e8f8f5;color:var(--s-masuk)}

.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);border:1px solid rgba(180,83,9,.15);margin-top:12px;font-size:13px;color:#7c2d12}
.nudge svg{width:20px;height:20px;flex:none;color:var(--warn)}
.nudge button{margin-left:auto;font-weight:700;color:var(--warn);font-size:13px;padding:6px 4px;white-space:nowrap}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat .k{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:6px 0 4px}
.stat.wide .v{font-size:22px;margin:4px 0 0}
.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)} .delta.flat{color:var(--muted)}
.splitbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;background:#eef2f7}
.splitbar i{display:block;height:100%}
.sub-split{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:6px;gap:8px}

/* ---------- Day list ---------- */
.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13px}
.month-h b{font-size:14px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:transform .12s}
.day:active{transform:scale(.985)}
.dbox{width:46px;height:50px;border-radius:13px;background:var(--grad-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:1px solid rgba(99,102,241,.12)}
.dbox b{font-size:18px;line-height:1;font-weight:800;color:var(--brand-2)}
.dbox span{font-size:10.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;margin-top:3px}
.dmid{flex:1;min-width:0}
.dmid .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dmid .r1 b{font-size:14px;font-weight:700}
.net{font-weight:800;font-size:14.5px;white-space:nowrap}
.net.pos{color:var(--good)} .net.neg{color:var(--bad)}
.dmid .r2{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmid .r3{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.mini{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;display:inline-flex;align-items:center;gap:3px}
.mini svg{width:12px;height:12px}
.mini.good{background:var(--good-bg);color:var(--good)} .mini.warn{background:var(--warn-bg);color:var(--warn)} .mini.neutral{background:#f1f5f9;color:var(--ink-2)}

/* ---------- Insights ---------- */
.ins{display:flex;gap:12px;align-items:flex-start;padding:14px}
.ins + .ins{border-top:1px solid var(--line-2)}
.ins .ii{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--grad-soft);color:var(--brand-2)}
.ins .ii svg{width:18px;height:18px}
.ins .it{font-size:12.5px;color:var(--ink-2);font-weight:600}
.ins .iv{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.ins .is{font-size:12.5px;color:var(--muted);margin-top:2px}
.card.flush{padding:0;overflow:hidden}

/* ---------- Charts ---------- */
.chart-card{padding:16px 14px 12px;position:relative}
.chart-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.chart-h h3{margin:0;font-size:14.5px;font-weight:700}
.chart-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 2px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:0;border-top:2px solid}
.legend .ln.dash{border-top-style:dashed}
.chart-scroll{overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.chart-scroll::-webkit-scrollbar{display:none}
svg.chart{display:block;touch-action:pan-x}
svg.chart .hit:focus{outline:none}
.bar-box{display:flex}
.bar-box .chart-scroll{flex:1;margin:0}
.bar-axis{flex:none}
svg.chart text{font-family:inherit;font-size:10.5px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;width:max-content;max-width:260px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.14);border-radius:12px;padding:8px 10px;font-size:12px;min-width:150px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
.tip.on{opacity:1;transform:none}
.tip .th{font-weight:700;margin-bottom:4px;color:var(--ink)}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between;color:var(--ink-2)}
.tip .tr b{white-space:nowrap;margin-left:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .tr span{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:#eef1f6;border-radius:12px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.split100{display:flex;gap:2px;height:28px;border-radius:10px;overflow:hidden;margin:12px 0 10px}
.split100 i{display:flex;align-items:center;padding:0 10px;color:#fff;font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;min-width:0;overflow:hidden}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:#f8fafc;border-radius:12px;padding:10px 12px}
.kv .k{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kv .v{font-weight:800;margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* ---------- Search ---------- */
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:15px;background:var(--card);border:1px solid var(--line);padding:0 14px;box-shadow:var(--shadow);margin-top:8px}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.search button{color:var(--muted);display:grid;place-items:center;width:28px;height:28px}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 10px var(--safe-b);background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.nav-in{max-width:640px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);height:100%;justify-content:center;transition:color .15s}
.nav-b svg{width:23px;height:23px;transition:transform .2s}
.nav-b.on{color:var(--brand-2)} .nav-b.on svg{transform:translateY(-1px)}
.fab{width:62px;height:62px;border-radius:21px;background:var(--grad);color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 10px 26px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:28px;height:28px}

/* ---------- Bottom sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.38);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:8px 18px calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;overflow-x:hidden;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -10px 40px rgba(15,23,42,.18)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#dde2ea;margin:4px auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-h h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.x-btn{width:38px;height:38px;border-radius:12px;background:#f1f4f9;display:grid;place-items:center;color:var(--ink-2)}
.x-btn svg{width:18px;height:18px}

.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#f1f4f9;padding:5px;border-radius:16px}
.type{height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-2);transition:all .18s}
.type svg{width:20px;height:20px}
.type.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.10)}
.type.on.pagi svg{color:var(--s-pagi)} .type.on.malam svg{color:var(--s-malam)} .type.on.pengeluaran svg{color:var(--s-keluar)} .type.on.real svg{color:var(--s-masuk)}

.amount{margin:16px 0 4px;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px;transition:border-color .15s,box-shadow .15s}
.amount:focus-within{border-color:rgba(99,102,241,.6);box-shadow:0 0 0 4px rgba(99,102,241,.12);background:#fff}
.amount.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(220,38,38,.10)}
.amount span{font-size:22px;font-weight:700;color:var(--muted)}
.amount input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amount input::placeholder{color:#c8cfdb}
.err-msg{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px;margin:2px 4px 0}
.quick{display:flex;gap:8px;margin:6px 0 4px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:1 0 auto;height:38px;padding:0 12px;border-radius:11px;background:#f1f4f9;font-weight:700;font-size:13px;color:var(--ink-2)}
.quick button:active{background:#e4e8f0}
.row-l{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:14px 2px 8px;display:flex;justify-content:space-between}
.date-chips{display:flex;gap:8px;align-items:center}
.date-pick{position:relative;flex:1}
.date-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.date-pick .chip{width:100%;justify-content:center}
.exist{margin-top:12px;padding:12px;border-radius:14px;background:#f5f6ff;border:1px solid rgba(99,102,241,.18);font-size:13px}
.exist .seg{margin-top:8px;width:100%;display:grid;grid-template-columns:1fr 1fr}
.exist .res{margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.note-in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;background:#fbfcfe;font-size:14.5px;resize:none}
.note-in:focus{border-color:rgba(99,102,241,.6);background:#fff}
.btn{height:54px;border-radius:16px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(99,102,241,.35)}
.btn.primary[disabled]{opacity:.65}

/* =====================================================================

   ===================================================================== */
const VERSI = '1.0';
const LS = {

/* ---------------- Ikon ---------------- */
const P = {

  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------------- Format ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ribuan = n => Math.abs(Math.round(n)).toLocaleString('id-ID');
const rp = n => n == null ? '—' : (n < 0 ? '−' : '') + 'Rp ' + ribuan(n);
const rpSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '') + 'Rp ' + ribuan(n);
function rpPendek(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e9) return s + (a / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
  if (a >= 1e6) return s + (a / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
  if (a >= 1e3) return s + Math.round(a / 1e3).toLocaleString('id-ID') + ' rb';
  return s + Math.round(a);
}
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hariIni = () => toISO(new Date());
const tambahHari = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const selisihHari = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 864e5);
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HR = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const tglPendek = iso => { const d = fromISO(iso); return `${d.getDate()} ${BLN[d.getMonth()]}`; };
const tglSedang = iso => { const d = fromISO(iso); return `${HR[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`; };
const tglPanjang = iso => { const d = fromISO(iso); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
function tglRelatif(iso) {
  const t = hariIni();
  if (iso === t) return 'Hari ini';
  if (iso === tambahHari(t, -1)) return 'Kemarin';
  return tglSedang(iso);
}

const FIELD = {
  pagi: { label: 'Pemasukan Pagi', pendek: 'Pagi', ikon: 'sun', cls: 'pagi', warna: 'var(--s-pagi)' },
  malam: { label: 'Pemasukan Malam', pendek: 'Malam', ikon: 'moon', cls: 'malam', warna: 'var(--s-malam)' },
  pengeluaran: { label: 'Pengeluaran', pendek: 'Pengeluaran', ikon: 'out', cls: 'keluar', warna: 'var(--s-keluar)' },
  real: { label: 'Total Real', pendek: 'Saldo Real', ikon: 'cash', cls: 'real', warna: 'var(--s-real)' },
};

/* ---------------- State ---------------- */
const S = {
  mode: null, rows: [], meta: {}, loaded: false, syncing: false, lastSync: null,
  tab: 'beranda', periode: LS.get('periode', { key: 'bulan' }),
  gran: 'auto', hist: { q: '', f: 'semua', limit: 40 },
  outbox: LS.get('outbox', []), installEvt: null,
};

/* ---------------- Logika data (dipakai demo & simpan offline) ---------------- */
const Logika = {
  urut: rows => rows.sort((a, b) => a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : 0),
  hitung(rows, meta) {
    if (meta && meta.modeRumus) return rows;
    let dasar = Number((meta && meta.saldoAwal) || 0);
    this.urut(rows).forEach(r => {
      r.tertulis = dasar + (r.pagi || 0) + (r.malam || 0) - (r.pengeluaran || 0);
      dasar = (meta && meta.dasarSaldo === 'real' && r.real != null) ? r.real : r.tertulis;
    });
    return rows;
  },
  simpan(rows, d) {
    let r = rows.find(x => x.tanggal === d.tanggal);
    if (!r) { r = { baris: Math.max(1, ...rows.map(x => x.baris || 1)) + 1, tanggal: d.tanggal, pagi: null, malam: null, pengeluaran: null, tertulis: null, real: null, catatan: '' }; rows.push(r); }
    Object.keys(d.isian || {}).forEach(k => { const o = d.isian[k]; r[k] = o.cara === 'tambah' ? (r[k] || 0) + o.nilai : o.nilai; });
    const c = (d.catatan || '').trim();
    if (c) r.catatan = r.catatan ? (r.catatan.includes(c) ? r.catatan : r.catatan + ' • ' + c) : c;
    return rows;
  },
  ubah(rows, d) {
    const r = rows.find(x => x.tanggal === d.tanggalAsli);
    if (!r) throw new Error('Data tidak ditemukan. Muat ulang aplikasi.');
    if (d.tanggal !== d.tanggalAsli && rows.some(x => x.tanggal === d.tanggal)) throw new Error('Sudah ada data untuk tanggal itu.');
    Object.assign(r, { tanggal: d.tanggal, pagi: d.pagi, malam: d.malam, pengeluaran: d.pengeluaran, real: d.real, catatan: d.catatan == null ? r.catatan : d.catatan });
    return rows;
  },
  hapus(rows, d) { return rows.filter(x => x.tanggal !== d.tanggal); },
};

/* ---------------- Mode demo ---------------- */
const Demo = {
  meta() { return { tab: 'Keuangan (contoh)', adaCatatan: true, modeRumus: false, dasarSaldo: 'tertulis', saldoAwal: 2500000, hariIni: hariIni() }; },
  buat() {
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const bulat = (a, b) => Math.round((a + rnd() * (b - a)) / 5000) * 5000;
    const notes = ['Belanja stok', 'Bayar listrik', 'Gaji harian', 'Ramai pembeli', 'Hujan, sepi', 'Servis motor', 'Beli gas'];
    const rows = []; const t = hariIni();
    for (let i = 80; i >= 0; i--) {
      const tgl = tambahHari(t, -i); const dow = fromISO(tgl).getDay();
      if (i > 0 && rnd() < .05) continue;
      const wk = dow === 0 || dow === 6 ? 1.25 : 1;
      const r = { baris: rows.length + 2, tanggal: tgl, pagi: bulat(250000, 750000) * wk, malam: bulat(450000, 1250000) * wk, pengeluaran: bulat(550000, 1500000), tertulis: null, real: null, catatan: rnd() < .22 ? notes[Math.floor(rnd() * notes.length)] : '' };
      if (i === 0) { r.malam = null; r.pengeluaran = 85000; }
      rows.push(r);
    }
    Logika.hitung(rows, this.meta());
    rows.forEach((r, i) => { if (i < rows.length - 1) r.real = rnd() < .18 ? r.tertulis - bulat(5000, 60000) : r.tertulis; });
    rows[rows.length - 2].real = null;
    return rows;
  },
  rows() { let r = LS.get('demo', null); if (!r) { r = this.buat(); LS.set('demo', r); } return r; },
  async jalankan(aksi, data) {
    await new Promise(res => setTimeout(res, 380));
    let rows = this.rows(); const meta = this.meta();
    if (aksi === 'simpan') rows = Logika.simpan(rows, data);
    else if (aksi === 'ubah') rows = Logika.ubah(rows, data);
    else if (aksi === 'hapus') rows = Logika.hapus(rows, data);
    Logika.hitung(rows, meta); LS.set('demo', rows);
    return { rows: JSON.parse(JSON.stringify(rows)), meta };
  },
};

/* ---------------- Backend ---------------- */
const isGAS = () => typeof google !== 'undefined' && google.script && google.script.run;
const Backend = {
  async call(aksi, data) {
    if (S.mode === 'gas') return new Promise((res, rej) => google.script.run
      .withSuccessHandler(s => { try { res(JSON.parse(s)); } catch (e) { rej(e); } })
      .withFailureHandler(e => rej(new Error((e && e.message) || String(e))))
      .api(aksi, data || {}));
    if (S.mode === 'api') return this.fetchApi(aksi, data);
    return Demo.jalankan(aksi, data);
  },
  async fetchApi(aksi, data, cfg) {
    cfg = cfg || LS.get('api', {});
    if (!cfg.url) throw new Error('Aplikasi belum terhubung.');
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
    let resp;
    try {
      resp = await fetch(cfg.url, { method: 'POST', redirect: 'follow', signal: ctl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ kunci: cfg.kunci, aksi, data: data || {} }) });
    } catch (e) {
      const err = new Error(ctl.signal.aborted ? 'Server terlalu lama merespons.' : 'Tidak ada koneksi internet.'); err.offline = !ctl.signal.aborted || !navigator.onLine; throw err;
    } finally { clearTimeout(to); }
    let j; try { j = await resp.json(); } catch (e) { throw new Error('Respons server tidak dikenali. Periksa URL API (harus diakhiri /exec) dan akses "Siapa saja".'); }
    if (!j.ok) throw new Error(j.error || 'Gagal.');
    return j.data;
  },
};

function terimaData(d) {
  S.rows = (d.rows || []).slice(); S.meta = d.meta || {}; S.loaded = true; S.lastSync = new Date().toISOString();
  Logika.urut(S.rows);
  if (S.mode !== 'demo') LS.set('cache_' + S.mode, { rows: S.rows, meta: S.meta, t: S.lastSync });
}

async function sinkron(diam) {
  if (S.syncing) return; S.syncing = true; renderTop();
  try {
    await kirimOutbox(true);
    terimaData(await Backend.call('data'));
    render();
    if (!diam) toast('Data terbaru sudah dimuat', 'ok');
  } catch (e) {
    if (!S.loaded) { S.loadErr = e.message; render(); }
    toast(e.offline ? 'Offline — menampilkan data terakhir' : 'Gagal memuat: ' + e.message, e.offline ? 'info' : 'err');
  } finally { S.syncing = false; renderTop(); }
}

/* ---------------- Antrian offline (versi aplikasi penuh) ---------------- */
async function kirimOutbox(diam) {
  if (S.mode !== 'api' || !S.outbox.length) return;
  let terkirim = 0;
  while (S.outbox.length) {
    const it = S.outbox[0];
    try { terimaData(await Backend.call(it.aksi, it.data)); S.outbox.shift(); LS.set('outbox', S.outbox); terkirim++; }
    catch (e) { if (e.offline) break; S.outbox.shift(); LS.set('outbox', S.outbox); toast('Satu catatan offline gagal dikirim: ' + e.message, 'err'); }
  }
  if (terkirim) { render(); if (!diam || terkirim) toast(`${terkirim} catatan offline berhasil dikirim`, 'ok'); }
  renderTop();
}
window.addEventListener('online', () => { if (S.mode === 'api') kirimOutbox(); });

/* ---------------- Perhitungan ---------------- */
function ringkas(from, to) {
  const rs = S.rows.filter(r => r.tanggal >= from && r.tanggal <= to);
  let pagi = 0, malam = 0, keluar = 0;
  rs.forEach(r => { pagi += r.pagi || 0; malam += r.malam || 0; keluar += r.pengeluaran || 0; });
  const masuk = pagi + malam;
  return { rs, pagi, malam, masuk, keluar, bersih: masuk - keluar, hari: rs.length };
}
function periode(p = S.periode) {
  const t = hariIni();
  if (p.key === 'hari') return { from: t, to: t, label: 'Hari ini' };
  if (p.key === 'minggu') { const dow = (fromISO(t).getDay() + 6) % 7; return { from: tambahHari(t, -dow), to: t, label: 'Minggu ini' }; }
  if (p.key === 'custom' && p.from && p.to) return { from: p.from, to: p.to, label: `${tglPendek(p.from)} – ${tglPendek(p.to)}` };
  return { from: t.slice(0, 8) + '01', to: t, label: 'Bulan ini' };
}
function periodeLalu(p = S.periode) {
  const c = periode(p);
  if (p.key === 'hari') { const y = tambahHari(c.from, -1); return { from: y, to: y, label: 'kemarin' }; }
  if (p.key === 'minggu') return { from: tambahHari(c.from, -7), to: tambahHari(c.to, -7), label: 'minggu lalu' };
  if (p.key === 'custom') { const n = selisihHari(c.from, c.to) + 1; return { from: tambahHari(c.from, -n), to: tambahHari(c.from, -1), label: 'periode sebelumnya' }; }
  const d = fromISO(c.from); const awal = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  const akhirBln = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
  const akhir = new Date(awal.getFullYear(), awal.getMonth(), Math.min(fromISO(c.to).getDate(), akhirBln));
  return { from: toISO(awal), to: toISO(akhir), label: 'bulan lalu' };
}
const persen = (a, b) => b ? (a - b) / Math.abs(b) * 100 : null;
function deltaHTML(cur, prev, naikBaik, label) {
  const p = persen(cur, prev);
  if (p == null) return `<span class="delta flat">Belum ada data ${esc(label)}</span>`;
  if (Math.abs(p) < 0.5) return `<span class="delta flat">≈ sama dengan ${esc(label)}</span>`;
  const naik = p > 0, baik = naik === naikBaik;
  return `<span class="delta ${baik ? 'good' : 'bad'}">${naik ? '▲' : '▼'} ${Math.abs(p).toLocaleString('id-ID', { maximumFractionDigits: 0 })}% <span class="muted" style="font-weight:500">vs ${esc(label)}</span></span>`;
}
function saldoTerakhir(sampai) {
  for (let i = S.rows.length - 1; i >= 0; i--) { const r = S.rows[i]; if (r.tanggal <= sampai && r.tertulis != null) return r; }
  return null;
}
function selisihTag(r, kecil) {
  if (!r || r.real == null || r.tertulis == null) return kecil ? `<span class="mini neutral">Real belum diisi</span>` : `<span class="tag neutral">${ic('info')} Real belum diisi</span>`;
  const s = r.real - r.tertulis;
  if (Math.abs(s) < 1) return kecil ? `<span class="mini good">${ic('check')} Cocok</span>` : `<span class="tag good">${ic('check')} Cocok</span>`;
  return kecil ? `<span class="mini warn">Selisih ${rpSigned(s)}</span>` : `<span class="tag warn">${ic('alert')} Selisih ${rpSigned(s)}</span>`;
}

function insight(p, pl) {
  const c = ringkas(p.from, p.to), l = ringkas(pl.from, pl.to), out = [];
  if (!c.hari) return out;
  const avgK = c.keluar / c.hari, avgKl = l.hari ? l.keluar / l.hari : null;
  out.push({ ikon: 'out', t: 'Rata-rata pengeluaran per hari', v: rp(avgK), s: avgKl != null ? deltaHTML(avgK, avgKl, false, pl.label) : `dari ${c.hari} hari tercatat` });
  const maxK = c.rs.reduce((m, r) => (r.pengeluaran || 0) > (m ? m.pengeluaran || 0 : -1) ? r : m, null);
  if (maxK && maxK.pengeluaran) out.push({ ikon: 'alert', t: 'Pengeluaran terbesar', v: rp(maxK.pengeluaran), s: esc(tglPanjang(maxK.tanggal)) + (maxK.catatan ? ' · ' + esc(maxK.catatan) : '') });
  if (c.masuk > 0) {
    const malamLebih = c.malam >= c.pagi, pct = Math.round((malamLebih ? c.malam : c.pagi) / c.masuk * 100);
    const hp = c.rs.filter(r => r.pagi != null).length, hm = c.rs.filter(r => r.malam != null).length;
    out.push({ ikon: malamLebih ? 'moon' : 'sun', t: 'Sesi paling ramai', v: `${malamLebih ? 'Malam' : 'Pagi'} · ${pct}% pemasukan`, s: `Rata-rata Pagi ${rp(hp ? c.pagi / hp : 0)} · Malam ${rp(hm ? c.malam / hm : 0)}` });
    out.push({ ikon: 'scale', t: 'Rasio pengeluaran', v: `${Math.round(c.keluar / c.masuk * 100)}% dari pemasukan`, s: l.masuk ? deltaHTML(c.keluar / c.masuk, l.keluar / l.masuk, false, pl.label) : 'Makin kecil makin sehat' });
  }
  if (c.hari > 1) {
    const best = c.rs.reduce((m, r) => { const b = (r.pagi || 0) + (r.malam || 0) - (r.pengeluaran || 0); return !m || b > m.b ? { r, b } : m; }, null);
    out.push({ ikon: 'trophy', t: 'Hari terbaik', v: rpSigned(best.b), s: esc(tglPanjang(best.r.tanggal)) });
  }
  const dicek = c.rs.filter(r => r.real != null && r.tertulis != null);
  if (dicek.length) {
    const beda = dicek.filter(r => Math.abs(r.real - r.tertulis) >= 1), tot = beda.reduce((a, r) => a + (r.real - r.tertulis), 0);
    out.push({ ikon: 'cash', t: 'Selisih kas (Real − Tertulis)', v: beda.length ? `${beda.length} dari ${dicek.length} hari tidak cocok` : 'Semua cocok 👍', s: beda.length ? `Total selisih ${rpSigned(tot)}` : `${dicek.length} hari sudah dicocokkan` });
  }
  const akhir = p.to > hariIni() ? hariIni() : p.to, ada = new Set(c.rs.map(r => r.tanggal)), kosong = [];
  for (let d = p.from; d <= akhir && kosong.length < 40; d = tambahHari(d, 1)) if (!ada.has(d)) kosong.push(d);
  if (kosong.length) out.push({ ikon: 'cal', t: 'Hari belum dicatat', v: `${kosong.length} hari`, s: kosong.slice(0, 4).map(tglPendek).join(', ') + (kosong.length > 4 ? ', …' : '') });
  return out;
}

/* ---------------- Riwayat ---------------- */
function filterRiwayat() {
  const h = S.hist, q = h.q.trim().toLowerCase();
  return S.rows.slice().reverse().filter(r => {
    if (h.f === 'selisih' && !(r.real != null && r.tertulis != null && Math.abs(r.real - r.tertulis) >= 1)) return false;
    if (h.f === 'catatan' && !r.catatan) return false;
    if (h.f === 'belum' && !['pagi', 'malam', 'pengeluaran', 'real'].some(k => r[k] == null)) return false;

    if (h.to && r.tanggal > h.to) return false;
    if (q) {
      const d = fromISO(r.tanggal);
      const teks = [tglPanjang(r.tanggal), `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`, `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`, r.tanggal, r.catatan || ''].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => teks.includes(w))) return false;
    }
    return true;
  });
}

/* ---------------- Sheet & dialog ---------------- */
function bukaSheet(html, onMount) {
  tutupSheet(true);
  const bd = document.createElement('div'); bd.className = 'backdrop'; bd.id = 'bd';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('on'); sh.classList.add('on'); });
  bd.onclick = () => tutupSheet();
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = () => tutupSheet());
  // geser ke bawah untuk menutup
  let y0 = null; const grab = sh.querySelector('.grab');
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0 && (e.target === grab || e.target.closest('.sh-h'))) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) tutupSheet(); });
  document.body.style.overflow = 'hidden';
  if (onMount) onMount(sh);
  return sh;
}
function tutupSheet(langsung) {
  const bd = $('#bd'), sh = $('#sheet'); if (!sh) return;
  document.body.style.overflow = '';
  if (langsung) { bd && bd.remove(); sh.remove(); return; }
  bd && bd.classList.remove('on'); sh.classList.remove('on');
  setTimeout(() => { bd && bd.remove(); sh.remove(); }, 320);
}
function konfirmasi({ judul, teks, ok = 'Ya', bahaya = true }) {
  return new Promise(res => {
    const bd = document.createElement('div'); bd.className = 'backdrop'; bd.style.zIndex = 59;
    const dl = document.createElement('div'); dl.className = 'dialog'; dl.setAttribute('role', 'alertdialog'); dl.setAttribute('aria-modal', 'true');
    dl.innerHTML = `<div class="di" style="${bahaya ? '' : 'background:var(--grad-soft);color:var(--brand-2)'}">${ic(bahaya ? 'trash' : 'info')}</div><h3>${esc(judul)}</h3><p>${teks}</p>
      <div class="btn-row"><button class="btn ghost sm" data-r="0">Batal</button><button class="btn ${bahaya ? 'danger' : 'primary'} sm" data-r="1" style="${bahaya ? 'background:var(--bad);color:#fff' : ''}">${esc(ok)}</button></div>`;
    document.body.append(bd, dl);
    requestAnimationFrame(() => { bd.classList.add('on'); dl.classList.add('on'); });
    const done = v => { bd.classList.remove('on'); dl.classList.remove('on'); setTimeout(() => { bd.remove(); dl.remove(); }, 230); res(v); };
    bd.onclick = () => done(false);
    dl.querySelectorAll('[data-r]').forEach(b => b.onclick = () => done(b.dataset.r === '1'));
    dl.querySelector('[data-r="0"]').focus();
  });
}
function toast(msg, type = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.setAttribute('role', type === 'err' ? 'alert' : 'status');
  el.innerHTML = ic(type === 'ok' ? 'check' : type === 'err' ? 'alert' : 'info') + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  const t = setTimeout(() => tutup(), type === 'err' ? 5200 : 2800);
  const tutup = () => { clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.onclick = tutup;
}

/* ---------------- Input cepat ---------------- */
function fieldDefault(tgl) {
  const r = S.rows.find(x => x.tanggal === tgl), jam = new Date().getHours();
  if (jam < 14) return r && r.pagi != null ? 'pengeluaran' : 'pagi';
  return r && r.malam != null ? (r.real == null && jam >= 20 ? 'real' : 'pengeluaran') : 'malam';
}
function bukaInput(opt = {}) {
  const st = { tanggal: opt.tanggal || hariIni(), field: null, angka: '', cara: null, catatan: '', saving: false };
  st.field = opt.field || fieldDefault(st.tanggal);

    <label class="amount" id="amtBox"><span>Rp</span><input id="amt" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="0" aria-label="Nominal"></label>

    $$('[data-type]', sh).forEach(b => { const on = b.dataset.type === st.field; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    const t = hariIni(), k = tambahHari(t, -1);
    $$('[data-d]', sh).forEach(b => b.classList.toggle('on', tambahHari(t, +b.dataset.d) === st.tanggal));
    const lain = st.tanggal !== t && st.tanggal !== k;

    $('#tglLbl', sh).textContent = tglPanjang(st.tanggal);
    const r = S.rows.find(x => x.tanggal === st.tanggal), ada = r ? r[st.field] : null;
    if (ada != null) {
      if (!st.cara) st.cara = st.field === 'pengeluaran' ? 'tambah' : 'ganti';
      const n = nilai() || 0, hasil = st.cara === 'tambah' ? ada + n : n;
      $('#exist', sh).innerHTML = `<div class="exist"><b>${FIELD[st.field].label}</b> tanggal ini sudah tercatat <b class="num">${rp(ada)}</b>.
        <div class="seg" role="group"><button class="${st.cara === 'tambah' ? 'on' : ''}" data-cara="tambah">Tambahkan</button><button class="${st.cara === 'ganti' ? 'on' : ''}" data-cara="ganti">Ganti nilainya</button></div>
        <div class="res">Hasil setelah disimpan: <b class="num">${nilai() == null ? '—' : rp(hasil)}</b></div></div>`;

  const setAngka = v => {

    amt.value = st.angka === '' ? '' : Number(st.angka).toLocaleString('id-ID');
    $('#amtErr', sh).textContent = ''; $('#amtBox', sh).classList.remove('err'); segar();
  };
  amt.addEventListener('input', () => {

  });
  amt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); simpan(); } });
  const salah = m => { $('#amtErr', sh).textContent = m; $('#amtBox', sh).classList.add('err'); amt.focus(); if (navigator.vibrate) navigator.vibrate([20, 40, 20]); };

    if (st.tanggal > hariIni()) return salah('Tanggal tidak boleh di masa depan.');

    st.saving = true; const btn = $('#btnSave', sh); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Menyimpan…';

    } catch (e) {
      if (e.offline && S.mode === 'api') {

async function mulai(mode) {
  S.mode = mode; S.loaded = false; S.loadErr = null;
  const cache = mode !== 'demo' ? LS.get('cache_' + mode, null) : null;
  if (cache) { S.rows = cache.rows; S.meta = cache.meta; S.lastSync = cache.t; S.loaded = true; }
  render();
  await sinkron(true);
}
(async function init() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'lainnya') renderView(); });
  if (isGAS()) return mulai('gas');
  const m = location.hash.match(/hubungkan=([^&]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    try { const o = JSON.parse(atob(decodeURIComponent(m[1]))); S.mode = 'api'; render(); await hubungkanApi(o.u, o.k); return; }
    catch (e) { S.mode = null; render(); toast('Tautan koneksi tidak valid: ' + e.message, 'err'); return; }
  }
  const catat = location.hash === '#catat';
  if (catat) history.replaceState(null, '', location.pathname + location.search);
  const saved = LS.get('mode', null);
  if (saved === 'api' && LS.get('api', {}).url) mulai('api');
  else if (saved === 'demo') mulai('demo');
  else render();
  if (catat && S.mode) setTimeout(() => bukaInput(), 400);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/googleusercontent|script\.google|claude/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.loaded && S.mode !== 'demo' && (!S.lastSync || Date.now() - new Date(S.lastSync) > 60000)) sinkron(true);
});
</script>
</body>
